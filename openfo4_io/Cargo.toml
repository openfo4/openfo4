[package]
name = "openfo4_io"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blocking = "1.6.2"
bitflags = "2.13.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["fs", "mm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }

[dev-dependencies]
futures-lite = "2.6.1"

[lints]
workspace = true
