[package]
name = "openfo4_crash_handler"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
tracy = ["openfo4_tracing"]

[dependencies]
openfo4_core = { version = "0.1.0", path = "../openfo4_core" }
openfo4_macros = { version = "0.1.0", path = "../openfo4_macros" }
openfo4_tracing = { version = "0.1.0", path = "../openfo4_tracing", features = ["tracy"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["signal"] }
rustix = { version = "0.38.39", features = ["mm"] }
linux-raw-sys = "0.6.5"

[lints]
workspace = true
