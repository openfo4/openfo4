[package]
name = "openfo4_core_pipeline"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
openfo4_render = { version = "0.1.0", path = "../openfo4_render" }
openfo4_tracing = { version = "0.1.0", path = "../openfo4_tracing" }
openfo4_common = { version = "0.1.0", path = "../openfo4_common" }
openfo4_shaderlib = { version = "0.1.0", path = "../openfo4_shaderlib" }

bytemuck = { version = "1.16.1", features = ["derive", "must_cast"] }
glam = { workspace = true, features = ["bytemuck"] }
tracing = { workspace = true }
hashbrown = { workspace = true }
crossbeam = "0.8.4"
parking_lot = "0.12.3"
bitflags = "2.9.0"
event-listener = "5.4.2"

[lints]
workspace = true
