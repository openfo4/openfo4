[workspace]
members = [
    "openfo4_ai",
    "openfo4_audio",
    "openfo4_common",
    "openfo4_crash_handler",
    "openfo4_input",
    "openfo4_macros",
    "openfo4_render",
    "openfo4_render/slangc",
    "openfo4_window",
    "openfo4_gizmos",
    "openfo4_gltf",
    "openfo4_tracing",
    "openfo4_tasks",
    "openfo4_core_pipeline",
    "openfo4_animation",
    "openfo4_client",
    "openfo4_core",
    "openfo4_dds",
    "openfo4_esp",
    "openfo4_esp_derive",
    "openfo4_hkx",
    "openfo4_hkx_derive",
    "openfo4_nif",
    "openfo4_physics", "openfo4_asset", "openfo4_pex", "openfo4_ba2", "openfo4_io",
    "openfo4_script", "openfo4_jit", "openfo4_ui_render", "openfo4_egui",
    "openfo4_shaderlib",
    "openfo4_shaderlib/macros",
]

resolver = "2"

[workspace.dependencies]
# Core
glam = "0.33.3"
hecs = "0.11.0"
hashbrown = "0.16.1"
tracing = "0.1.44"
parking_lot = "0.13.0"

# Use zlib-rs since it performs better.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }

[workspace.lints.rust]
renamed_and_removed_lints = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
non_ascii_idents = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(loom)',
    'cfg(openfo4_embed_shaders)',
] }

[profile.dev]
opt-level = 0
lto = "off"
debug-assertions = true
overflow-checks = true
panic = "abort"

[profile.release]
debug-assertions = false
overflow-checks = false
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
