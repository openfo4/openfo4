[workspace]
members = [
    "game_ai",
    "game_audio",
    "game_core",
    "game_common",
    "game_crash_handler",
    "game_ui",
    "game_input",
    "game_macros",
    "game_render",
    "game_render/slangc",
    "game_window",
    "game_gizmos",
    "game_gltf",
    "game_tracing",
    "game_tasks",
    "game_core_pipeline",
    "openfo4_animation",
    "openfo4_client",
    "openfo4_core",
    "openfo4_dds",
    "openfo4_esp",
    "openfo4_esp_derive",
    "openfo4_hkx",
    "openfo4_hkx_derive",
    "openfo4_nif",
    "openfo4_physics", "openfo4_asset", "openfo4_pex", "openfo4_ba2", "openfo4_io",
    "openfo4_script", "openfo4_jit", "game_ui_render", "game_egui",
    "openfo4_shaderlib",
    "openfo4_shaderlib/macros",
]

resolver = "2"

[workspace.dependencies]
# Core
glam = "0.33.3"
hecs = "0.11.0"
hashbrown = "0.16.1"
tracing = "0.1.44"

# Use zlib-rs since it performs better.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }

[workspace.lints.rust]
renamed_and_removed_lints = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
ffi-unwind-calls = "forbid"
missing-abi = "forbid"
non-ascii-idents = "forbid"
#pointer_structural_match = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(loom)',
    'cfg(openfo4_embed_shaders)',
] }

[profile.dev]
opt-level = 0
lto = "off"
debug-assertions = true
overflow-checks = true
panic = "abort"

[profile.release]
debug-assertions = false
overflow-checks = false
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
