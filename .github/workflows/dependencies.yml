name: Dependencies

on:
  push:
    branches: [ "master" ]
    paths:
    - '**/Cargo.toml'
    - 'deny.toml'
  pull_request:
    branches: [ "master" ]
    paths:
    - '**/Cargo.toml'
    - 'deny.toml'

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: https://github.com/EmbarkStudios/cargo-deny-action@v2
      with:
        command: check bans licenses sources
