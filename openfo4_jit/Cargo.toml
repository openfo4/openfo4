[package]
name = "openfo4_jit"
version = "0.1.0"
edition = "2024"

[features]
default = ["cranelift"]
cranelift = ["cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module"]

[dependencies]
slab = "0.4.11"

# Cranelift backend
cranelift-codegen = { version = "0.125.3", optional = true }
cranelift-frontend = { version = "0.125.3", optional = true }
cranelift-jit = { version = "0.125.3", optional = true }
cranelift-module = { version = "0.125.3", optional = true }

[lints]
workspace = true

[[test]]
name = "smoke"
path = "tests/smoke.rs"
