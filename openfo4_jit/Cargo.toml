[package]
name = "openfo4_jit"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["cranelift"]
cranelift = ["cranelift-codegen", "cranelift-frontend", "cranelift-native", "wasmtime-internal-jit-icache-coherence", "capstone"]

[dependencies]
openfo4_common = { version = "0.1.0", path = "../openfo4_common" }
openfo4_tracing = { version = "0.1.0", path = "../openfo4_tracing" }
openfo4_io = { version = "0.1.0", path = "../openfo4_io" }

slab = "0.4.11"
hashbrown = { workspace = true }
parking_lot = { workspace = true }

# Cranelift backend
cranelift-codegen = { version = "0.135.2", optional = true }
cranelift-frontend = { version = "0.135.2", optional = true }
cranelift-native = { version = "0.135.2", optional = true }
wasmtime-internal-jit-icache-coherence = { version = "48.0.2", optional = true }
capstone = { version = "0.14.0", optional = true }

[lints]
workspace = true

[[test]]
name = "smoke"
path = "tests/smoke.rs"
