[package]
name = "openfo4_core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
tracy = []

[dependencies]
openfo4_common = { version = "0.1.0", path = "../openfo4_common" }
openfo4_esp = { version = "0.1.0", path = "../openfo4_esp" }
openfo4_tracing = { version = "0.1.0", path = "../openfo4_tracing" }

hecs = { workspace = true }
glam = { workspace = true, features = ["bytemuck"] }
hashbrown = { workspace = true }
bstr = "1.12.1"
parking_lot = { workspace = true }
thiserror = "2.0.17"
nohash-hasher = "0.2.0"

# Logger
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["registry"] }
chrono = "0.4.38"

[lints]
workspace = true
