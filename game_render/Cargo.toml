[package]
name = "game_render"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
default = ["wayland", "x11"]

# Enable Wayland on unix targets.
wayland = []

# Enable X11 on unix targets.
x11 = []

[dependencies]
game_window = { version = "0.1.0", path = "../game_window" }
game_common = { version = "0.1.0", path = "../game_common" }
game_tracing = { version = "0.1.0", path = "../game_tracing" }
game_tasks = { version = "0.1.0", path = "../game_tasks" }

bytemuck = { version = "1.16.1", features = ["derive", "must_cast"] }
glam = { workspace = true, features = ["bytemuck"] }
tracing = { workspace = true }
parking_lot = "0.12.3"
bitflags = { version = "2.6.0", features = ["bytemuck"] }
bevy_mikktspace = { version = "1.0.0", features = ["corrected-edge-sorting", "corrected-vertex-welding"] }
thiserror = "1.0.61"
bytes = "1.10.1"

ash = "0.38.0+1.3.281"
raw-window-handle = "0.6.2"
slab = "0.4.12"
crossbeam-queue = "0.3.12"
nohash-hasher = "0.2.0"
bumpalo = { version = "3.17.0", features = ["allocator-api2"] }
hashbrown = { workspace = true, features = ["allocator-api2"] }
allocator-api2 = "0.2.21"
sharded-slab = "0.1.7"

naga = { version = "27.0.3", features = ["wgsl-in", "spv-out"] }
spirv = "0.3.0+sdk-1.3.268.0"
slangc = { version = "0.1.0", path = "./slangc" }

notify = "8.0.0"

[dev-dependencies]
spirv-tools = "0.11.0"
