[package]
name = "openfo4_client"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["tracy"]
# Enable tracy profiler client.
tracy = ["openfo4_crash_handler/tracy", "openfo4_core/tracy"]

[dependencies]
openfo4_window = { version = "0.1.0", path = "../openfo4_window" }
openfo4_render = { version = "0.1.0", path = "../openfo4_render" }
openfo4_tasks = { version = "0.1.0", path = "../openfo4_tasks" }
openfo4_common = { version = "0.1.0", path = "../openfo4_common" }
openfo4_tracing = { version = "0.1.0", path = "../openfo4_tracing" }
openfo4_input = { version = "0.1.0", path = "../openfo4_input" }
openfo4_crash_handler = { version = "0.1.0", path = "../openfo4_crash_handler" }
openfo4_core_pipeline = { version = "0.1.0", path = "../openfo4_core_pipeline" }
openfo4_gizmos = { version = "0.1.0", path = "../openfo4_gizmos" }
openfo4_egui = { version = "0.1.0", path = "../openfo4_egui" }
openfo4_ui_render = { version = "0.1.0", path = "../openfo4_ui_render" }
openfo4_gltf = { version = "0.1.0", path = "../openfo4_gltf" }
openfo4_ai = { version = "0.1.0", path = "../openfo4_ai" }

openfo4_nif = { version = "0.1.0", path = "../openfo4_nif" }
openfo4_esp = { version = "0.1.0", path = "../openfo4_esp" }
openfo4_dds = { version = "0.1.0", path = "../openfo4_dds" }
openfo4_hkx = { version = "0.1.0", path = "../openfo4_hkx" }
openfo4_core = { version = "0.1.0", path = "../openfo4_core" }
openfo4_physics = { version = "0.1.0", path = "../openfo4_physics" }
openfo4_animation = { version = "0.1.0", path = "../openfo4_animation" }
openfo4_asset = { version = "0.1.0", path = "../openfo4_asset" }
openfo4_ba2 = { version = "0.1.0", path = "../openfo4_ba2" }
openfo4_io = { version = "0.1.0", path = "../openfo4_io" }
openfo4_script = { version = "0.1.0", path = "../openfo4_script" }
openfo4_pex = { version = "0.1.0", path = "../openfo4_pex" }
openfo4_config = { version = "0.1.0", path = "../openfo4_config" }

glam = { workspace = true, features = ["bytemuck"] }
hecs = { workspace = true }
tracing = { workspace = true }
bytes = "1.10.1"
thiserror = { workspace = true }
crossbeam = "0.8.4"
async-channel = "2.3.1"
parking_lot = { workspace = true }
async-lock = "3.4.0"
hashbrown = { workspace = true }
slab = "0.4.10"
indexmap = "2.12.1"
futures = "0.3.31"
async-io = "2.6.0"

futures-lite = "2.6.0"
bitflags = "2.9.4"
rand = "0.9.2"
nohash-hasher = "0.2.0"
clap = { version = "4.5.54", features = ["derive"] }
bytemuck = "1.24.0"
event-listener = "5.4.1"
rstar = "0.13.0"

serde = { version = "1.0.228", features = ["derive"] }

[lints]
workspace = true
