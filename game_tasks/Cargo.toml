[package]
name = "game_tasks"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
crossbeam-queue = "0.3.12"
atomic-waker = "1.1.2"
parking_lot = "0.12.3"

futures-core = "0.3.31"
futures-lite = "2.6.0"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[dev-dependencies]
criterion = "0.5.1"

[[test]]
name = "loom"
path = "tests/park/loom.rs"

[[bench]]
name = "spawn"
path = "benches/spawn.rs"
harness = false
