[package]
name = "macros"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0.86"
quote = "1.0.36"
syn = { version = "2.0.68", features = ["full", "extra-traits"] }

game_render = { version = "0.1.0", path = "../../game_render" }

slangc = { version = "0.1.0", path = "../../game_render/slangc" }
naga = { version = "27.0.3", features = ["wgsl-in", "spv-out"] }
