[package]
name = "openfo4_shaderlib"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hashbrown = { workspace = true }
openfo4_render = { version = "0.1.0", path = "../openfo4_render" }
tracing = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(openfo4_embed_shaders)'.dependencies]
macros = { version = "0.1.0", path = "./macros" }

[target.'cfg(not(openfo4_embed_shaders))'.dependencies]
slangc = { version = "0.1.0", path = "../openfo4_render/slangc" }
naga = { version = "27.0.3", features = ["wgsl-in", "spv-out"] }
# Hot reloading
notify = "8.0.0"

[lints]
workspace = true
