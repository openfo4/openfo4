[package]
name = "game_ui"
version = "0.1.0"
edition = "2021"

[features]
default = []

[lints]
workspace = true

[dependencies]
game_input = { version = "0.1.0", path = "../game_input" }
game_render = { version = "0.1.0", path = "../game_render" }
game_window = { version = "0.1.0", path = "../game_window" }
game_tracing = { version = "0.1.0", path = "../game_tracing" }
game_common = { version = "0.1.0", path = "../game_common" }
game_tasks = { version = "0.1.0", path = "../game_tasks" }

glam = { workspace = true }
tracing = { workspace = true }
ab_glyph = "0.2.28"
image = { version = "0.25.1", default-features = false, features = ["jpeg", "png"] }
bytemuck = "1.16.1"
parking_lot = "0.12.3"
thiserror = "1.0.61"
async-io = "2.3.3"
futures = "0.3.30"

# SVG rendering
usvg = "0.42.0"
resvg = "0.42.0"
tiny-skia = "0.11.4"

# Clipboard
arboard = { version = "3.4.0", default-features = false }

[target.'cfg(unix)'.dependencies]
smithay-clipboard = "0.7.2"
raw-window-handle = "0.6.0"

[dev-dependencies]
criterion = "0.5.1"

[[test]]
name = "layout_table"
path = "tests/layout/table.rs"

[[test]]
name = "layout_table_interleaved"
path = "tests/layout/table_interleaved.rs"

[[bench]]
name = "layout_flat"
path = "benches/layout.rs"
harness = false

[[bench]]
name = "background"
path = "benches/render/background.rs"
harness = false
