[package]
name = "openfo4_esp"
version = "0.1.0"
edition = "2021"

[features]
default = ["serde"]
serde = []

[dependencies]
bitflags = { version = "2.9.0", features = ["serde"] }
bytemuck = "1.22.0"
bytes = "1.10.0"
openfo4_esp_derive = { version = "*", path = "../openfo4_esp_derive" }
glam = { version = "0.30.0", features = ["bytemuck", "serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.12"
flate2 = "1.1.0"
hashbrown = "0.15.4"
