[package]
name = "openfo4_esp"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.9.0"
bytemuck = "1.22.0"
bytes = "1.10.0"
openfo4_esp_derive = { version = "*", path = "../openfo4_esp_derive" }
glam = { version = "0.28.0", features = ["bytemuck"] }
thiserror = "2.0.12"
hashbrown = "0.15.4"
# Use zlib-rs since it performs better.
flate2 = { version = "1.1.0", default-features = false, features = ["zlib-rs"] }
parking_lot = "0.12.5"

openfo4_io = { version = "0.1.0", path = "../openfo4_io" }

futures-lite = "2.6.1"
